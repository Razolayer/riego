<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alarma Vecinal">
<meta name="robots" content="noindex">
<title>Alarma Vecinal</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#controls{display:contents}
body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#111;color:#eee;
display:flex;flex-direction:column;align-items:center;gap:22px;
padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.5px}
#st{font-size:15px;color:#aaa;min-height:20px;text-align:center;max-width:320px}
#big{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;border:0;font-size:26px;font-weight:700;
color:#fff;background:#2b2b2b;box-shadow:0 0 0 6px #333;transition:.2s}
#big.on{background:#d32f2f;box-shadow:0 0 0 6px #ff6b6b,0 0 40px #f44;animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 10px #ff6b6b,0 0 70px #f44}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.s{padding:12px 18px;border-radius:12px;border:1px solid #444;background:#1d1d1d;color:#eee;font-size:16px}
button:active{transform:scale(.96)}
button:disabled{opacity:.5}
#off{background:#2e7d32;border-color:#2e7d32;width:min(80vw,300px);font-size:20px;padding:16px;font-weight:600}
.box{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
input{padding:12px;border-radius:12px;border:1px solid #444;background:#1d1d1d;color:#eee;font-size:16px;
width:200px;text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:6px}
.ok{background:#4caf50}.bad{background:#f44336}.wait{background:#ffb300}
#log{width:min(92vw,360px);font-size:13px;color:#999;list-style:none;padding:0;margin:0}
#log li{padding:6px 0;border-top:1px solid #222}
#log time{color:#666;margin-right:6px}
small{color:#666;text-align:center}
#invalid{color:#888;margin:40px 0 0;text-align:center}
#who{color:#bbb;font-size:15px;text-align:center}
button.link{background:none;border:0;color:#64b5f6;font-size:14px;padding:4px 6px}
</style>
</head>
<body>
<h1>&#128680; Alarma Vecinal</h1>
<div id="st"><span class="dot wait" id="dot"></span><span id="msg">Conectando...</span></div>

<p id="invalid" hidden>Enlace inválido o vencido.</p>

<div id="controls" hidden>
  <button class="s" id="off">APAGAR</button>
  <button id="big">ACTIVAR</button>
  <div class="row">
    <button class="s" data-s="5">5 s</button>
    <button class="s" data-s="30">30 s</button>
    <button class="s" data-s="60">1 min</button>
  </div>
  <button class="s" id="ping">&#128225; Probar conexión</button>
  <div id="who" hidden>&#128100; <b id="whoname"></b> · &#128274; PIN guardado <button class="link" id="edit">cambiar</button></div>
  <div class="box" id="pinbox">
    <input id="name" placeholder="Tu nombre" maxlength="24" autocomplete="name">
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN (para activar)">
    <button class="s" id="savewho">Listo</button>
  </div>
  <ul id="log"></ul>
  <small>Apagar no pide PIN.<span id="hint"><br>Completá nombre y PIN, tocá Listo y después agregalo a la pantalla de inicio: el botón los recuerda.</span></small>
</div>

<script>
const SERVER = 'https://ntfy-me.com';
const NO_REPLY_MS = 10000;
const $ = id => document.getElementById(id);

// Link: #<topic>[&n=<nombre>][&p=<pin>]. Lo que va después del # queda en el celu
// (en el botón de la pantalla de inicio) y nunca se envía al servidor de la página.
const hashParts = location.hash.slice(1).split('&');
let topic = '';
try { topic = decodeURIComponent(hashParts[0]).trim(); } catch (e) {}
const hashParams = new URLSearchParams(hashParts.slice(1).join('&'));
// Sin un link con formato válido no se muestra nada (ni pistas de cómo funciona)
function validTopic(t) { return /^[a-z0-9][a-z0-9_-]{15,63}$/.test(t); }
let on = false, offAt = 0, lastSeen = 0, waiting = null, es = null;
let offline = false, noticeUntil = 0;

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

// Guarda nombre y PIN en la memoria y en el link actual, para que "Agregar a pantalla de inicio" los recuerde
function remember() {
  const n = $('name').value.trim(), p = $('pin').value.trim();
  store('name', n || null);
  store('pin', p || null);
  const q = new URLSearchParams();
  if (n) q.set('n', n);
  if (p) q.set('p', p);
  const s = q.toString();
  history.replaceState(null, '', '#' + topic + (s ? '&' + s : ''));
}

function show(text, kind) { $('msg').textContent = text; $('dot').className = 'dot ' + kind; }
// Aviso que no pisa el refresco de estado por unos segundos
function notice(text, kind) { show(text, kind || 'bad'); noticeUntil = Date.now() + 5000; }

function render() {
  const rem = offAt ? Math.max(0, Math.round(offAt - Date.now() / 1000)) : 0;
  if (on && offAt && rem === 0) on = false; // el corte automático ya debería haber actuado
  $('big').classList.toggle('on', on);
  $('big').textContent = on ? 'SONANDO' : 'ACTIVAR';
  if (waiting || Date.now() < noticeUntil) return;
  if (offline) { show('El equipo no responde (¿sin luz o sin internet?)', 'bad'); return; }
  if (!lastSeen) { show('Esperando respuesta del equipo...', 'wait'); return; }
  show(on ? (rem ? 'ACTIVA, se apaga en ' + rem + ' s' : 'ACTIVA') : 'En reposo', 'ok');
}

function addLog(text, t) {
  const li = document.createElement('li');
  const time = document.createElement('time');
  time.textContent = new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  li.append(time, text);
  $('log').prepend(li);
  while ($('log').children.length > 6) $('log').lastChild.remove();
}

// Texto corto para el historial a partir de los mensajes del equipo
function pretty(text) {
  let r;
  if (/ACTIVADA/.test(text)) {
    r = text.match(/desde (.+?) \(se apaga en (\d+) s\)/);
    return '🚨 Alarma activada' + (r ? ' por ' + r[2] + ' s · ' + r[1] : '');
  }
  if ((r = text.match(/^Ya estaba apagada(?: \((.+)\))?/))) return 'Ya estaba apagada' + (r[1] ? ' · ' + r[1] : '');
  if ((r = text.match(/apagada \((.+)\)/))) return 'Alarma apagada · ' + r[1];
  if ((r = text.match(/^Atención: la Pico se reinició \((.+?)\)/))) return '⚠ El equipo se reinició: ' + r[1];
  if ((r = text.match(/^Pico conectada \(reinicio: (.+?)\)/))) return 'Equipo conectado (' + r[1] + ')';
  if (/^Pico conectada/.test(text)) return 'Equipo conectado';
  if ((r = text.match(/^Equipo en línea ✅ \(prueba de (.+?)\)/))) return 'Equipo en línea ✅ · prueba de ' + r[1];
  if (/^SABOTAJE/.test(text)) return '⚠ SABOTAJE: despegaron el equipo';
  if (/^Antisabotaje armado/.test(text)) return 'Antisabotaje armado';
  if (/^Antisabotaje sin armar/.test(text)) return 'Antisabotaje sin armar';
  if (/^WiFi reconectado/.test(text)) return 'Equipo reconectado';
  if ((r = text.match(/^PIN incorrecto, no se activó(?: \((.+?)\))?/))) return 'PIN incorrecto' + (r[1] ? ' · ' + r[1] : '');
  if ((r = text.match(/^Estado: ACTIVA(?:, se apaga en (\d+) s)?/))) return 'Estado: ACTIVA' + (r[1] ? ', se apaga en ' + r[1] + ' s' : '');
  if (/^Estado: en reposo/.test(text)) return 'Estado: en reposo';
  return text.replace(/\. App: .*$/, '');
}

// Interpreta los mensajes que publica el equipo (tag "pico")
function fromPico(m, live) {
  const text = m.message || '';
  lastSeen = m.time;
  let r;
  if (/ACTIVADA/.test(text) || /^Estado: ACTIVA/.test(text)) {
    on = true;
    r = text.match(/se apaga en (\d+) s/);
    offAt = r ? m.time + Number(r[1]) : 0;
  } else if (/apagada|en reposo/i.test(text)) {
    on = false; offAt = 0;
  }
  addLog(pretty(text), m.time);
  if (live) offline = false;
  // Respuesta a un comando nuestro: estábamos esperando y (si hay nombre) lo menciona
  const myName = $('name').value.trim();
  const mine = live && waiting && (!myName || text.includes(myName));
  if (live && waiting) { clearTimeout(waiting); waiting = null; }
  if (mine && /^Equipo en línea/.test(text)) { render(); notice('Equipo en línea ✅', 'ok'); return; }
  if (mine && /PIN incorrecto/.test(text)) { $('pin').value = ''; remember(); setEditing(true); notice('PIN incorrecto'); return; }
  render();
}

// Agrega " por <nombre>" para que la Pico avise quién fue
function by(message) {
  const n = $('name').value.trim();
  store('name', n || null);
  return n ? message + ' por ' + n : message;
}

async function send(message, priority) {
  if (navigator.vibrate) navigator.vibrate(40);
  const url = SERVER + '/' + encodeURIComponent(topic) + '/publish?message=' + encodeURIComponent(message) +
              '&priority=' + (priority || 1); // los comandos no notifican: solo las respuestas de la Pico
  let sentId = '';
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    sentId = (await r.json()).id || '';
  } catch (e) {
    notice('No se pudo enviar (¿sin internet?)');
    return;
  }
  clearTimeout(waiting);
  show('Enviado, esperando respuesta...', 'wait');
  waiting = setTimeout(() => { waiting = null; offline = true; render(); }, NO_REPLY_MS);
  // En el celu la conexión en vivo (SSE) puede estar cortada sin avisar:
  // además de escucharla, preguntamos por la respuesta hasta que llegue.
  const deadline = Date.now() + NO_REPLY_MS;
  while (waiting && Date.now() < deadline) {
    await new Promise(res => setTimeout(res, 1500));
    if (waiting && sentId) await poll(sentId, true);
  }
}

// Procesa cada mensaje una sola vez (puede llegar por SSE y por consulta)
const seen = new Set();
let lastId = '';
function handle(m, live) {
  if (m.event !== 'message' || seen.has(m.id)) return;
  seen.add(m.id);
  lastId = m.id;
  if ((m.tags || []).includes('pico')) fromPico(m, live);
}

async function poll(since, live) {
  try {
    const r = await fetch(SERVER + '/' + encodeURIComponent(topic) + '/json?poll=1&since=' + encodeURIComponent(since),
                          { cache: 'no-store' });
    (await r.text()).trim().split('\n').filter(Boolean).forEach(l => handle(JSON.parse(l), live));
  } catch (e) {}
}

function needPin() {
  const pin = $('pin').value.trim();
  if (!pin) { setEditing(true); notice('Poné el PIN para activar'); $('pin').focus(); return null; }
  store('pin', pin);
  return pin;
}

function subscribe() {
  if (es) es.close();
  es = new EventSource(SERVER + '/' + encodeURIComponent(topic) + '/sse');
  es.onmessage = ev => handle(JSON.parse(ev.data), true);
  es.onerror = () => { if (!waiting) show('Reconectando con ntfy...', 'wait'); };
}

// Con nombre y PIN cargados se muestra solo el nombre (el PIN queda oculto); si no, los campos
function setEditing(editing) {
  $('pinbox').hidden = !editing;
  $('hint').hidden = !editing;
  $('who').hidden = editing;
  $('whoname').textContent = $('name').value.trim();
}

async function start() {
  $('controls').hidden = false;
  $('pin').value = hashParams.get('p') || load('pin');
  $('name').value = hashParams.get('n') || load('name');
  $('pin').oninput = $('name').oninput = remember;
  remember();
  setEditing(!($('name').value.trim() && $('pin').value.trim()));
  $('edit').onclick = () => { setEditing(true); $('name').focus(); };
  $('savewho').onclick = () => {
    remember();
    if ($('name').value.trim() && $('pin').value.trim()) setEditing(false);
    else notice('Completá nombre y PIN');
  };
  subscribe();
  // Último estado conocido (últimos 30 min) y pedido de estado fresco
  await poll('30m', false);
  render();
  send('estado', 1);
}

// Al volver a la app (iPhone la congela en segundo plano): reconectar y ponerse al día
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !validTopic(topic)) return;
  subscribe();
  await poll(lastId || '30m', false);
  render();
  send('estado', 1);
});

$('off').onclick = () => send(by('apagar'));
$('ping').onclick = () => send(by('ping'));
$('big').onclick = () => {
  if (on) return send(by('apagar'));
  const pin = needPin(); if (pin) send(by('activar ' + pin));
};
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  const pin = needPin(); if (pin) send(by('pulso ' + b.dataset.s + ' ' + pin));
});
window.addEventListener('hashchange', () => location.reload());
if (validTopic(topic)) setInterval(render, 1000);

if (validTopic(topic)) start();
else { $('st').hidden = true; $('invalid').hidden = false; }
</script>
</body>
</html>
